services:
- type: web
  name: trivia-battle
  runtime: docker
  plan: free
  healthCheckPath: /health
  envVars:
  - key: PORT
    value: 3000
  # ตั้งค่าใน Render dashboard (ไม่ commit ค่าลง git)
  - key: ADMIN_PIN
    sync: false
  - key: OPENROUTER_API_KEY
    sync: false
  - key: OPENROUTER_MODELS
    sync: false
  # คลังคำถาม (SQLite) จะคงอยู่ข้าม deploy ได้ต้องมี Persistent Disk
  # ซึ่ง Render รองรับเฉพาะแผนเสียเงิน (Starter ขึ้นไป) — ถ้าอัปแผนแล้ว
  # เปิดคอมเมนต์ 4 บรรทัดนี้ (Dockerfile ตั้ง DB_PATH=/data/trivia.db รอไว้แล้ว):
  # disk:
  #   name: trivia-data
  #   mountPath: /data
  #   sizeGB: 1
